[package]
name = "fsdr-blocks"
version = "0.2.0"
edition = "2024"
authors = ["FutureSDR Contributors <team@futuresdr.org>"]
license = "Apache-2.0"
homepage = "https://www.futuresdr.org"
repository = "https://github.com/futuresdr/fsdr-blocks/"
description = "Building blocks for FutureSDR signal processing library for SDR and real-time DSP."
keywords = ["sdr", "radio", "dsp", "async", "acceleration"]
categories = ["asynchronous", "concurrency", "hardware-support", "science"]
readme = "README.md"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    ".",
    "crates/*",
    "examples/*",
]

[workspace.dependencies]
futuresdr = "0.9.0"
async-channel = "2.5"
crossbeam-channel = "0.5"
bimap = "0.6"
async-fs = "2.2"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
thiserror = "2.0"
quickcheck = "1.1"
quickcheck_macros = "1"
criterion = { version = "0.8", features = ["html_reports"] }
tokio-test = "0.4"
rand = { version = "0.10", features = ["thread_rng"] }
uuid = { version = "1.21", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rustc_version = "0.4.0"

[dependencies]
futuresdr = { workspace = true }
async-channel = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
bimap = { workspace = true, optional = true }
sigmf = { version = "0.1", path = "crates/sigmf" }
async-fs = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
futuresdr = { workspace = true, features = ["mocker"] }
criterion = { workspace = true }
quickcheck_macros = { workspace = true }
tokio-test = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
crossbeam = ["dep:crossbeam-channel"]
async-channel = ["dep:async-channel"]
cw = ["dep:bimap"]

[[bench]]
name = "crossbeam_sink"
path = "benches/channel/crossbeam_sink.rs"
harness = false
required-features = ["crossbeam"]

[[bench]]
name = "crossbeam_source"
path = "benches/channel/crossbeam_source.rs"
harness = false
required-features = ["crossbeam"]

[[bench]]
name = "cw_to_char"
path = "benches/cw/cw_to_char.rs"
harness = false
required-features = ["cw"]

[[bench]]
name = "bb_to_cw"
path = "benches/cw/baseband_to_cw.rs"
harness = false
required-features = ["cw"]

[[bench]]
name = "shared"
path = "benches/cw/shared.rs"
harness = false
required-features = ["cw"]

[[bench]]
name = "agc"
path = "benches/agc.rs"
harness = false

[[bench]]
name = "type_converters"
path = "benches/type_converters.rs"
harness = false

[[bench]]
name = "freq_shift"
path = "benches/math/freq_shift.rs"
harness = false

[[bench]]
name = "deinterleave"
path = "benches/stream/deinterleave.rs"
harness = false

[[bench]]
name = "stdinout"
path = "benches/stdinout.rs"
harness = false


